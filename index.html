<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pub Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column — a beer-mat button up top, the pick below, settings tucked underneath */
:root{
  --bg:#eef0ec; --surface:#ffffff; --ink:#1d2a2a; --muted:#5d6b68; --line:#d5dbd6;
  --accent:#c47a12; --accent-ink:#ffffff; --open:#2f7d4f; --closed:#a33a2a; --unknown:#7a6a2a;
  --display:"Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141c1c; --surface:#1d2727; --ink:#e9ece6; --muted:#9aa8a4; --line:#2f3b3a;
    --accent:#e19a35; --accent-ink:#1a1206; --open:#6cc48f; --closed:#ee8a78; --unknown:#d6c37a; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding:max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header h1{font:400 clamp(2rem,9vw,2.6rem)/1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
header p{margin:8px 0 0;color:var(--muted)}

.mat-zone{display:grid;place-items:center;padding-block:8px}
.mat{width:min(64vw,230px);aspect-ratio:1;max-width:100%;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font:400 1.5rem/1.1 var(--display);
  box-shadow:inset 0 0 0 8px var(--accent), inset 0 0 0 11px color-mix(in srgb,var(--accent-ink) 55%,transparent), 0 10px 24px -12px rgba(0,0,0,.45);
  transition:transform .15s ease}
.mat:hover{transform:rotate(-4deg)}
.mat:active{transform:scale(.97)}
.mat:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.mat[disabled]{opacity:.75;cursor:progress}
.mat.spinning{animation:spin .9s cubic-bezier(.3,.1,.3,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.mat,.mat.spinning{animation:none;transition:none}}
.mat small{display:block;font:700 .8rem/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}

.status{text-align:center;color:var(--muted);min-height:1.5em;margin:0}
.status.err{color:var(--closed)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card h2{font:400 1.7rem/1.15 var(--display);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted)}
.dist{font:500 .95rem var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.pill{font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1.5px solid currentColor}
.pill.open{color:var(--open)} .pill.unknown{color:var(--unknown)} .pill.closed{color:var(--closed)}
.addr,.hours{margin:0;overflow-wrap:anywhere}
.hours{font:500 .85rem/1.5 var(--mono);color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{flex:1 1 140px;display:inline-flex;justify-content:center;align-items:center;min-height:44px;padding:8px 14px;border-radius:10px;
  font:700 1rem var(--body);text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.settings{display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:20px}
.label{font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.chips label small{color:var(--muted);margin-left:4px}
.chips input:checked+label{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.chips input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.foot{color:var(--muted);font-size:.85rem;margin:0}
.foot a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pub Roulette</h1>
    <p>Finds pubs and bars near you that are open right now, then picks one.</p>
  </header>

  <div class="mat-zone">
    <button class="mat" id="go" type="button">Pick a pub<small>tap to spin</small></button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <article class="card" id="result" hidden>
    <h2 id="r-name"></h2>
    <div class="meta">
      <span class="pill" id="r-pill"></span>
      <span class="dist" id="r-dist"></span>
      <span id="r-type"></span>
    </div>
    <p class="addr" id="r-addr"></p>
    <p class="hours" id="r-hours"></p>
    <div class="actions">
      <a class="btn primary" id="r-dir" target="_blank" rel="noopener">Directions</a>
      <button class="btn" id="again" type="button">Pick another</button>
    </div>
  </article>

  <section class="settings" aria-label="Settings">
    <div>
      <p class="label">Search radius</p>
      <div class="chips" id="radius">
        <input type="radio" name="r" id="r500" value="500"><label for="r500">500 m<small>~6 min</small></label>
        <input type="radio" name="r" id="r1000" value="1000" checked><label for="r1000">1 km<small>~12 min</small></label>
        <input type="radio" name="r" id="r2000" value="2000"><label for="r2000">2 km<small>~25 min</small></label>
        <input type="radio" name="r" id="r5000" value="5000"><label for="r5000">5 km</label>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="bars" checked><span>Include bars and beer gardens, not just pubs</span></label>
    <label class="check"><input type="checkbox" id="unknown"><span>Include places with no listed opening hours<br><small style="color:var(--muted)">Lots of pubs don't publish hours on the map, so ticking this widens the pool but you may find the door shut.</small></span></label>
    <p class="foot">Pub data and opening hours come from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors. Your location never leaves your device except to ask the map for nearby places.</p>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const ENDPOINTS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"];
  const DAYS = ["Mo","Tu","We","Th","Fr","Sa","Su"];
  let pool = [], lastPick = null, cacheKey = "";

  // ---------- Opening-hours parser (common OSM forms) ----------
  // Returns {open:true|false, closes?:"HH:MM"} or null when the hours can't be read.
  function parseTime(s){
    const m = /^(\d{1,2}):(\d{2})$/.exec(s.trim()); if(!m) return null;
    return +m[1]*60 + +m[2];
  }
  function parseDays(s){
    const set = new Set();
    for (const part of s.split(",")){
      const p = part.trim();
      const r = /^(Mo|Tu|We|Th|Fr|Sa|Su)(?:-(Mo|Tu|We|Th|Fr|Sa|Su))?$/.exec(p);
      if(!r) return null;
      let a = DAYS.indexOf(r[1]), b = r[2] ? DAYS.indexOf(r[2]) : a;
      for(let i=a;;i=(i+1)%7){ set.add(i); if(i===b) break; }
    }
    return set;
  }
  function buildWeek(oh){
    const week = Array.from({length:7}, () => []);
    const rules = oh.replace(/\|\|/g,";").split(";").map(r=>r.trim()).filter(Boolean);
    if(!rules.length) return null;
    for (const rule of rules){
      if(/^(PH|SH)\b/.test(rule)) continue;           // public/school holiday rules: ignore
      if(rule === "24/7"){ week.forEach((_,i)=>week[i]=[[0,1440]]); continue; }
      const m = /^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?)(?:\s*,\s*(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?)*)?(?:\s*,\s*PH)?\s*(.*)$/.exec(rule);
      if(!m) return null;
      const days = m[1] ? parseDays(m[1].replace(/\s/g,"")) : new Set([0,1,2,3,4,5,6]);
      if(!days) return null;
      let rest = m[2].trim();
      let intervals;
      if(rest === "" ) intervals = [[0,1440]];
      else if(/^(off|closed)$/i.test(rest)) intervals = [];
      else {
        intervals = [];
        for (const span of rest.split(",")){
          const t = span.trim().split("-");
          if(t.length!==2) return null;
          const a = parseTime(t[0]), b0 = parseTime(t[1]);
          if(a==null || b0==null) return null;
          let b = b0; if(b <= a) b += 1440;            // runs past midnight
          intervals.push([a,b]);
        }
      }
      days.forEach(d => week[d] = intervals);          // later rules override earlier ones
    }
    return week;
  }
  function fmt(min){ min%=1440; return String(Math.floor(min/60)).padStart(2,"0")+":"+String(min%60).padStart(2,"0"); }
  function openNow(oh, now=new Date()){
    if(!oh) return null;
    let week; try{ week = buildWeek(oh); }catch(e){ return null; }
    if(!week) return null;
    const d = (now.getDay()+6)%7, y = (d+6)%7, t = now.getHours()*60+now.getMinutes();
    for (const [a,b] of week[d]) if(t>=a && t<b) return {open:true, closes: b>=1440 && a===0 && b===1440 ? null : fmt(b)};
    for (const [a,b] of week[y]) if(b>1440 && t+1440>=a && t+1440<b) return {open:true, closes: fmt(b)};
    return {open:false};
  }

  // ---------- Data ----------
  function getLocation(){
    return new Promise((res,rej) => {
      if(!navigator.geolocation) return rej(new Error("This browser can't share its location."));
      navigator.geolocation.getCurrentPosition(p => res(p.coords), e => {
        rej(new Error(e.code===1 ? "Location access was blocked. Allow it in your browser settings and try again."
          : "Couldn't get a location fix. Check location services are on and try again."));
      }, {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
    });
  }
  async function fetchPlaces(lat, lon, radius, bars){
    const kinds = bars ? "pub|bar|biergarten" : "pub";
    const q = `[out:json][timeout:25];nwr["amenity"~"^(${kinds})$"](around:${radius},${lat},${lon});out center tags;`;
    let lastErr;
    for (const url of ENDPOINTS){
      try{
        const r = await fetch(url, {method:"POST", body:"data="+encodeURIComponent(q), headers:{"Content-Type":"application/x-www-form-urlencoded"}});
        if(!r.ok) throw new Error("HTTP "+r.status);
        const j = await r.json();
        return j.elements;
      }catch(e){ lastErr = e; }
    }
    throw new Error("The pub map service isn't responding right now. Try again in a minute.");
  }
  function distance(lat1, lon1, lat2, lon2){
    const R=6371000, rad=x=>x*Math.PI/180;
    const dLat=rad(lat2-lat1), dLon=rad(lon2-lon1);
    const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }
  function shape(el, here){
    const t = el.tags||{}, lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
    if(!t.name || lat==null) return null;
    const addr = [t["addr:housenumber"] && t["addr:street"] ? t["addr:housenumber"]+" "+t["addr:street"] : t["addr:street"], t["addr:city"]||t["addr:town"], t["addr:postcode"]].filter(Boolean).join(", ");
    return { name:t.name, kind:t.amenity, lat, lon, addr, hours:t.opening_hours||"", dist:distance(here.latitude,here.longitude,lat,lon) };
  }

  // ---------- UI ----------
  function setStatus(msg, err){ $("status").textContent = msg; $("status").classList.toggle("err", !!err); }
  function busy(on){ $("go").disabled = on; $("go").classList.toggle("spinning", on); $("again").disabled = on; }

  function show(p){
    lastPick = p;
    $("r-name").textContent = p.name;
    const pill = $("r-pill");
    pill.className = "pill " + (p.state ? "open" : "unknown");
    pill.textContent = p.state ? (p.state.closes ? "Open till "+p.state.closes : "Open now") : "Hours unknown";
    const m = Math.round(p.dist/10)*10;
    $("r-dist").textContent = (m<1000 ? m+" m" : (p.dist/1000).toFixed(1)+" km") + " · ~" + Math.max(1,Math.round(p.dist/80)) + " min walk";
    $("r-type").textContent = {pub:"Pub",bar:"Bar",biergarten:"Beer garden"}[p.kind]||"";
    $("r-addr").textContent = p.addr; $("r-addr").hidden = !p.addr;
    $("r-hours").textContent = p.hours; $("r-hours").hidden = !p.hours;
    $("r-dir").href = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=walking`;
    $("result").hidden = false;
  }
  function pick(){
    if(!pool.length) return;
    let choices = pool.length>1 && lastPick ? pool.filter(p=>p!==lastPick) : pool;
    show(choices[Math.floor(Math.random()*choices.length)]);
  }

  async function run(forceRefresh){
    const radius = +document.querySelector('input[name="r"]:checked').value;
    const bars = $("bars").checked, unk = $("unknown").checked;
    busy(true); setStatus("Finding you…");
    try{
      const here = await getLocation();
      const key = [radius,bars,here.latitude.toFixed(3),here.longitude.toFixed(3)].join("|");
      if(forceRefresh || key!==cacheKey){
        setStatus("Looking for pubs nearby…");
        const els = await fetchPlaces(here.latitude, here.longitude, radius, bars);
        window.__all = els.map(e=>shape(e,here)).filter(Boolean);
        cacheKey = key;
      }
      const all = window.__all.map(p => ({...p, state: openNow(p.hours)}));
      const open = all.filter(p => p.state && p.state.open);
      const unknown = all.filter(p => !p.state);
      pool = unk ? open.concat(unknown) : open;
      // re-point lastPick at the new object if same place
      if(lastPick) lastPick = pool.find(p=>p.name===lastPick.name && p.lat===lastPick.lat) || lastPick;
      const word = bars ? "places" : "pubs";
      if(!all.length){ $("result").hidden = true; setStatus(`No ${word} found within ${radius>=1000?radius/1000+" km":radius+" m"}. Try a bigger radius.`, true); return; }
      if(!pool.length){ $("result").hidden = true;
        setStatus(`Found ${all.length} ${word}, but none are listed as open now.` + (unk ? "" : " Tick “Include places with no listed opening hours” to widen the search."), true); return; }
      setStatus(`${open.length} open` + (unk ? ` + ${unknown.length} with unknown hours` : "") + ` · ${all.length} ${word} in range`);
      pick();
    }catch(e){ setStatus(e.message, true); }
    finally{ busy(false); }
  }

  $("go").addEventListener("click", () => { lastPick = null; run(false); });
  $("again").addEventListener("click", () => { pick(); });
  ["bars","unknown"].forEach(id => $(id).addEventListener("change", () => { if(cacheKey) run(id==="bars"); }));
  document.querySelectorAll('input[name="r"]').forEach(r => r.addEventListener("change", () => { cacheKey=""; }));

  window.__openNow = openNow; // handy for testing
})();
</script>
</body>
</html>
